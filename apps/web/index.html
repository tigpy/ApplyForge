<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Career Desk | Aryan Singh</title>
    <!-- Fraunces & Figtree Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Editorial Header -->
        <header class="desk-header">
            <div class="brand-row">
                <div class="wordmark-group">
                    <span class="system-badge">SAFE AUTOMATION V1.0</span>
                    <h1 class="brand-title">Career Desk</h1>
                    <span class="candidate-tag">Aryan Singh · Ground-Truth Verified</span>
                </div>
                <div class="header-pills">
                    <span class="status-pill safe-on"><span class="dot green"></span> Zero-Silent-Submissions ACTIVE</span>
                    <span class="status-pill db-status"><span class="dot"></span> SQLite / Postgres Ready</span>
                    <button class="action-btn-small" onclick="DeskApp.triggerSync()">↻ Sync Connectors</button>
                </div>
            </div>

            <!-- Top Horizontal Navigation Pills (NO SIDEBAR) -->
            <nav class="nav-pills-bar">
                <button class="nav-pill active" data-tab="desk">Desk Overview</button>
                <button class="nav-pill" data-tab="queue">Review Queue <span class="badge-count" id="queue-badge">0</span></button>
                <button class="nav-pill" data-tab="jobs">Job Feed</button>
                <button class="nav-pill" data-tab="applications">All Applications</button>
                <button class="nav-pill" data-tab="profile">Candidate Ground-Truth</button>
                <button class="nav-pill" data-tab="resumes">Resume Variants</button>
                <button class="nav-pill" data-tab="connectors">Discovery Sources</button>
                <button class="nav-pill" data-tab="audit">Security & Audit</button>
                <button class="nav-pill" data-tab="settings">Settings</button>
            </nav>
        </header>

        <!-- Main Content Area -->
        <main class="desk-main" id="view-container">
            <!-- Dynamic Tab Views Rendered Here -->
        </main>
    </div>

    <!-- Review Modal Container -->
    <div id="modal-container" class="modal-overlay hidden">
        <div class="modal-card" id="modal-content">
            <!-- Rendered by JS -->
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
