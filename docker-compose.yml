services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: applyforge-postgres
    restart: always
    environment:
      POSTGRES_DB: applyforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: applyforge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: applyforge-api
    restart: always
    environment:
      - APP_NAME=ApplyForge
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/applyforge
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - SAFE_MODE=true
      - ZERO_SILENT_SUBMISSIONS=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: applyforge-worker
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/applyforge
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: applyforge-web
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    container_name: applyforge-caddy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
