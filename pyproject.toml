[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-application-automation"
version = "0.1.0"
description = "Job Application Automation Platform with Candidate Grounding, Explainable Matching, and Strict Human Approval"
authors = [{ name = "Aryan Singh" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.18",
    "reportlab>=4.1.0",
    "pypdf>=4.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "cryptography>=42.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "celery>=5.3.0",
    "redis>=5.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = [".", "packages", "apps"]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps*"]
